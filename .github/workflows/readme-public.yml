name: Refresh project statistics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write
concurrency:
  group: readme-public-statistics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish aggregate public project counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request, urllib.parse
          repo=os.environ['GITHUB_REPOSITORY'];now=dt.datetime.now(dt.timezone.utc)
          def api(path):
              request=urllib.request.Request('https://api.github.com'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Velocity-statistics'})
              return json.load(urllib.request.urlopen(request,timeout=25))
          def pages(path):
              for page in range(1,101):
                  rows=api(path+('&' if '?' in path else '?')+'per_page=100&page='+str(page))
                  yield from rows
                  if len(rows)<100:return
              raise RuntimeError('Pagination limit reached')
          base='/repos/'+repo;metadata=api(base)
          def search(kind,state):
              query='repo:'+repo+' is:'+kind+' is:'+state
              return api('/search/issues?q='+urllib.parse.quote(query,safe=''))['total_count']
          dates=[dt.datetime.fromisoformat(c['commit']['committer']['date'].replace('Z','+00:00')).astimezone(dt.timezone.utc).date() for c in pages(base+'/commits?sha='+urllib.parse.quote(metadata['default_branch'],safe=''))]
          first=now.date()-dt.timedelta(days=364)
          year=[dates.count(first+dt.timedelta(days=i)) for i in range(365)]
          data=dict(schema=1,repo=repo,updated=now.isoformat(),stars=metadata['stargazers_count'],forks=metadata['forks_count'],watchers=metadata['subscribers_count'],open_pr=search('pr','open'),merged_pr=search('pr','merged'),open_issues=search('issue','open'),closed_issues=search('issue','closed'),releases=sum(not r.get('draft',False) for r in pages(base+'/releases')),languages={},contributors=[],actions={},pages={},activity=year[-28:],activity_year=year,commits_total=len(dates),periods=[])
          for days in (1,7,30,365):
              current=now.date()-dt.timedelta(days=days-1);previous=current-dt.timedelta(days=days)
              data['periods'].append(dict(days=days,current=sum(current<=d<=now.date() for d in dates),previous=sum(previous<=d<current for d in dates)))
          audience='https://api.isvelocity.ru/readme-widgets/publish'
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(audience,safe='')
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token=json.load(urllib.request.urlopen(request,timeout=20))['value']
          request=urllib.request.Request(audience,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'Velocity-README-Publisher/1.0'})
          with urllib.request.urlopen(request,timeout=30) as response:
              if response.status!=201:raise RuntimeError('Publishing failed')
          print('Public aggregate statistics refreshed')
          PY
